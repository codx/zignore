name: Dependabot auto-merge

# Squash-merges open Dependabot PRs once they are at least cooldown-days old
# and all their checks have passed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: run-action/automerge@6fc2ea88aa5fa753e97db7ae8255233e9a99fa31 # v1.0.0
        with:
          cooldown-days: 3
